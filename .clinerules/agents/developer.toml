[agent]
id = "developer"
name = "Full-Stack Developer"
role = "developer"
model = "gemini-2.5-flash"

[responsibilities]
description = "Escribe e implementa código de alta calidad, refactoriza y resuelve problemas técnicos."

[behavior]
concise = true
direct = true
